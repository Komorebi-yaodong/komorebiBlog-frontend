        window.MathJax = {
            tex2jax: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            TeX: {
                extensions: ['AMSmath.js','AMSsymbols.js'],
                equationNumbers: { autoNumber: "all" }
            },
            CommonHTML: { linebreaks: { automatic: true } }
        };
    </script>
