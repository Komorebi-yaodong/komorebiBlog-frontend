<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komorebi's Blog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Poppins:wght@300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="hero">
        <div class="container text-center">
            <h1 class="hero-title">Komorebi's Blog</h1>
            <p class="hero-subtitle">思考与记录的空间</p>
        </div>
    </div>

    <div class="container main-content">
        <div class="content-wrapper">
            <div class="row">
                <div class="col-lg-12">

                    <ul class="nav nav-tabs main-tabs" id="contentTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="posts-tab" data-bs-toggle="tab"
                                data-bs-target="#posts-tab-pane" type="button" role="tab" aria-controls="posts-tab-pane"
                                aria-selected="false">
                                <i class="far fa-newspaper"></i> 最新文章
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="links-tab" data-bs-toggle="tab"
                                data-bs-target="#links-tab-pane" type="button" role="tab" aria-controls="links-tab-pane"
                                aria-selected="true">
                                <i class="fas fa-link"></i> 网站导航
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="contentTabsContent">
                        <div class="tab-pane fade show active" id="posts-tab-pane" role="tabpanel"
                            aria-labelledby="posts-tab" tabindex="0">
                            <div class="row">
                                <div class="col-md-9">
                                    <div id="posts-list" class="posts-list list-layout">
                                        <div class="loading">
                                            <div class="spinner"></div>
                                            <p>正在加载文章...</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="tags-sidebar" id="posts-tags-sidebar">
                                        <h5 class="tags-sidebar-title">文章标签</h5>
                                        <ul id="posts-tags-list" class="list-unstyled tags-list">
                                            <li class="text-muted small">加载中...</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="links-tab-pane" role="tabpanel" aria-labelledby="links-tab"
                            tabindex="0">
                            <div class="row">
                                <div class="col-md-9">
                                    <div id="links-list" class="links-list list-layout">
                                        <div class="loading">
                                            <div class="spinner"></div>
                                            <p>正在加载导航链接...</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                     <div class="tags-sidebar" id="links-tags-sidebar">
                                        <h5 class="tags-sidebar-title">导航标签</h5>
                                        <ul id="links-tags-list" class="list-unstyled tags-list">
                                             <li class="text-muted small">加载中...</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <p>&copy; 2025 Komorebi's Blog. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="https://github.com/Komorebi-yaodong" target="_blank" class="social-link">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NS2438VDCH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-NS2438VDCH');
    </script>
</body>
</html>
