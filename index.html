<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komorebi's Blog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hero">
        <div class="container text-center">
            <h1 class="hero-title">Komorebi's Blog</h1>
            <p class="hero-subtitle">思考与记录的空间</p>
        </div>
    </div>

    <div class="container main-content">
       <div class="content-wrapper">
            <div class="row">
                <div class="col-md-10 offset-md-1 col-lg-8 offset-lg-2">

                    <!-- === 网站导航 Section (移到前面) === -->
                    <div class="links-container">
                        <h2 class="section-title">网站导航</h2>
                        <div id="links-list" class="links-list">
                            <div class="loading">
                                <div class="spinner"></div>
                                <p>正在加载导航链接...</p>
                            </div>
                        </div>
                    </div>
                    <!-- === End of 网站导航 Section === -->


                    <!-- === 最新文章 Section (移到后面) === -->
                    <div class="posts-container section-separator">
                        <h2 class="section-title">最新文章</h2>
                        <div id="posts-list" class="posts-list">
                            <div class="loading">
                                <div class="spinner"></div>
                                <p>正在加载文章...</p>
                            </div>
                        </div>
                    </div>
                     <!-- === End of 最新文章 Section === -->

                </div>
            </div>
       </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <p>&copy; 2025 Komorebi's Blog. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="https://github.com/Komorebi-yaodong" target="_blank" class="social-link">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
