<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相册 - Komorebi's Blog</title> <!-- Title will be set by JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="bg-layer-1" class="background-layer"></div>
    <div id="bg-layer-2" class="background-layer"></div>

    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Komorebi's Blog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavGlobal" aria-controls="navbarNavGlobal" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavGlobal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html?initial_tab=albums-tab">相册集</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="photo-sphere-container" class="flex-grow-1">
        <div id="loading-photos" class="loading">
            <div class="spinner"></div>
            <p>正在加载照片...</p>
        </div>
        <div class="photo-navigation-controls">
            <button id="deeper-layer-btn" class="photo-nav-btn" title="更里层 (下一层)">
                <i class="fas fa-angle-double-up"></i>
            </button>
            <button id="shallower-layer-btn" class="photo-nav-btn" title="更外层 (上一层)">
                <i class="fas fa-angle-double-down"></i>
            </button>
        </div>
    </div>

    <div id="photo-modal" class="photo-modal-overlay">
        <div class="photo-modal-content">
            <span class="photo-modal-close">×</span>
            <img id="modal-image" src="" alt="Focused Photo">
            <div id="modal-caption">
                <h3 id="modal-title"></h3>
                <p id="modal-description"></p>
                <p id="modal-time-container" style="display: none; margin-top: 0.5rem; opacity: 0.8;"><small><i class="far fa-calendar-alt me-1"></i><span id="modal-time"></span></small></p>
            </div>
        </div>
    </div>

    <footer class="footer mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <p>© 2025 Komorebi's Blog. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end footer-social-links">
                    <a href="https://github.com/Komorebi-yaodong" target="_blank" class="social-link">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/background-switcher.js"></script>
    <script src="js/album.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "c4ebc2c7db394cb2ae1830b295a8fd7c"}'></script>
</body>
</html>
